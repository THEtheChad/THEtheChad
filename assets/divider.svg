<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 16" width="840" height="16" role="img" aria-label="divider">
  <style>
    .sweep { animation: sweep 6s ease-in-out infinite alternate; }
    @keyframes sweep { from { transform: translateX(-140px); } to { transform: translateX(840px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { display: none; } }
  </style>
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#33ff66" stop-opacity=".9"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="8" x2="840" y2="8" stroke="#1c8a3f" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 5"/>
  <rect class="sweep" x="0" y="7" width="140" height="2" fill="url(#light)" filter="url(#g)"/>
</svg>
