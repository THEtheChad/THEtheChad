<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 340" width="840" height="340" role="img" aria-label="Retro CRT terminal booting THEtheChad's profile">
  <title>THEtheChad :: code / hardware / tinkering</title>
  <style>
    text { font-family: 'IBM Plex Mono','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace; font-size: 16px; white-space: pre; }
    .a { opacity: 0; animation: on 1ms linear forwards; }
    @keyframes on { to { opacity: 1; } }
    .cur { opacity: 0; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    .pwr { transform-box: view-box; transform-origin: 420.0px 161.0px;
            animation: pwr .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pwr { 0% { transform: scale(.6,.004); opacity: 0; }
                      25% { transform: scale(1,.004); opacity: 1; }
                      100% { transform: scale(1,1); opacity: 1; } }
    .flash { opacity: 0; animation: flash .9s ease-out both; }
    @keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }
    .flk { animation: flk 9s linear infinite; }
    @keyframes flk { 0%, 60%, 62%, 64%, 100% { opacity: 1; } 61% { opacity: .92; } 63% { opacity: .96; } }
    .scan { animation: scan 8s linear infinite; }
    @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(308px); } }
    .led { animation: led 3.2s ease-in-out infinite; }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) {
      .a, .cur { opacity: 1; animation: none; }
      .pwr, .flk, .led { animation: none; }
      .flash, .scan { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34362f"/><stop offset="1" stop-color="#1a1b17"/>
    </linearGradient>
    <radialGradient id="tube" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#0c1d11"/><stop offset="1" stop-color="#020503"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#33ff66" stop-opacity=".07"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ledglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="24" y="22" width="792" height="278" rx="14"/></clipPath>
  </defs>

  <!-- Case -->
  <rect width="840" height="340" rx="22" fill="url(#bezel)"/>
  <rect x="17" y="15" width="806" height="292" rx="19" fill="#0b0c0a"/>
  <rect x="24" y="22" width="792" height="278" rx="14" fill="url(#tube)"/>

  <!-- Screen -->
  <g clip-path="url(#screen)">
    <g class="pwr">
      <rect class="flash" x="24" y="22" width="792" height="278" fill="#33ff66"/>
      <g class="flk" filter="url(#glow)">
      <text class="a" x="60.0" y="64" textLength="432.0" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:0.60s">PHOSPHOR BIOS v1.986   (C) THEtheChad SYSTEMS</text>
      <text class="a" x="60.0" y="94" textLength="28.8" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:1.05s">CPU</text>
      <text class="a" x="98.4" y="94" textLength="249.6" lengthAdjust="spacing" fill="#1c8a3f" style="animation-delay:1.05s">..........................</text>
      <text class="a" x="357.6" y="94" textLength="124.8" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:1.30s">CAFFEINE-8086</text>
      <text class="a" x="501.6" y="94" textLength="57.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:1.40s">[ OK ]</text>
      <text class="a" x="60.0" y="124" textLength="105.6" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:1.65s">MEMORY TEST</text>
      <text class="a" x="175.2" y="124" textLength="172.8" lengthAdjust="spacing" fill="#1c8a3f" style="animation-delay:1.65s">..................</text>
      <text class="a" x="357.6" y="124" textLength="38.4" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:1.90s">640K</text>
      <text class="a" x="501.6" y="124" textLength="57.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:2.00s">[ OK ]</text>
      <text class="a" x="60.0" y="154" textLength="144.0" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:2.25s">LOADING PROFILE</text>
      <text class="a" x="223.2" y="154" textLength="9.6" lengthAdjust="spacing" fill="#1c8a3f" style="animation-delay:2.25s">[</text>
      <text class="a" x="424.8" y="154" textLength="9.6" lengthAdjust="spacing" fill="#1c8a3f" style="animation-delay:2.25s">]</text>
      <rect class="a" x="233.8" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.45s"/>
      <rect class="a" x="243.4" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.51s"/>
      <rect class="a" x="253.0" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.57s"/>
      <rect class="a" x="262.6" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.63s"/>
      <rect class="a" x="272.2" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.69s"/>
      <rect class="a" x="281.8" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.75s"/>
      <rect class="a" x="291.4" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.81s"/>
      <rect class="a" x="301.0" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.87s"/>
      <rect class="a" x="310.6" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.93s"/>
      <rect class="a" x="320.2" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:2.99s"/>
      <rect class="a" x="329.8" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.05s"/>
      <rect class="a" x="339.4" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.11s"/>
      <rect class="a" x="349.0" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.17s"/>
      <rect class="a" x="358.6" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.23s"/>
      <rect class="a" x="368.2" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.29s"/>
      <rect class="a" x="377.8" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.35s"/>
      <rect class="a" x="387.4" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.41s"/>
      <rect class="a" x="397.0" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.47s"/>
      <rect class="a" x="406.6" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.53s"/>
      <rect class="a" x="416.2" y="142" width="7.6" height="14" fill="#33ff66" style="animation-delay:3.59s"/>
      <text class="a" x="444.0" y="154" textLength="38.4" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:3.70s">100%</text>
      <text class="a" x="60.0" y="214" textLength="48.0" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:4.15s">C:\&gt; </text>
      <text class="a" x="108.0" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:4.50s">w</text>
      <text class="a" x="117.6" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:4.63s">h</text>
      <text class="a" x="127.2" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:4.76s">o</text>
      <text class="a" x="136.8" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:4.89s">a</text>
      <text class="a" x="146.4" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:5.02s">m</text>
      <text class="a" x="156.0" y="214" textLength="9.6" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:5.15s">i</text>
      <text class="a" x="60.0" y="244" textLength="96.0" lengthAdjust="spacing" fill="#c6ffd6" style="animation-delay:5.68s">THEtheChad</text>
      <text class="a" x="165.6" y="244" textLength="288.0" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:5.68s">:: code / hardware / tinkering</text>
      <text class="a" x="60.0" y="274" textLength="48.0" lengthAdjust="spacing" fill="#33ff66" style="animation-delay:6.13s">C:\&gt; </text>
      <rect class="cur" x="108.5" y="261" width="8.6" height="16" fill="#33ff66" style="animation-delay:6.13s"/>
      </g>
    </g>
    <rect class="scan" x="24" y="22" width="792" height="90" fill="url(#beam)"/>
    <rect x="24" y="22" width="792" height="278" fill="url(#lines)"/>
    <rect x="24" y="22" width="792" height="278" fill="url(#vignette)"/>
    <rect x="24" y="22" width="792" height="278" fill="url(#glare)"/>
  </g>

  <!-- Case badge, vents, power LED -->
  <text x="42" y="326" fill="#7a7c72" font-size="11" letter-spacing="3" font-weight="700">THETHECHAD PC-1986</text>
  <g fill="#0e0f0d">
    <rect x="600" y="316" width="22" height="3" rx="1.5"/><rect x="628" y="316" width="22" height="3" rx="1.5"/>
    <rect x="656" y="316" width="22" height="3" rx="1.5"/><rect x="684" y="316" width="22" height="3" rx="1.5"/>
    <rect x="600" y="323" width="22" height="3" rx="1.5"/><rect x="628" y="323" width="22" height="3" rx="1.5"/>
    <rect x="656" y="323" width="22" height="3" rx="1.5"/><rect x="684" y="323" width="22" height="3" rx="1.5"/>
  </g>
  <text x="776" y="325" fill="#7a7c72" font-size="10" letter-spacing="2" text-anchor="end">PWR</text>
  <circle class="led" cx="792" cy="321" r="4" fill="#ffb000" filter="url(#ledglow)"/>
</svg>
